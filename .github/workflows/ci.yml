
name: AcademicLab - CI/CD y Dashboard

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  pruebas:
    name: Integracion Continua
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -v \
            --cov=main \
            --cov=app \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:reportes/cobertura \
            --cov-report=xml:reportes/coverage.xml \
            --junitxml=reportes/resultados.xml

      - name: Generar dashboard visual
        if: always()
        run: |
          python generar_dashboard.py

      - name: Publicar dashboard y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academiclab-dashboard-visual
          path: reportes/
          if-no-files-found: warn
          retention-days: 30

      - name: Verificar resultado de pruebas
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "ERROR: Las pruebas fallaron"
            exit 1
          fi

          echo "Pruebas automatizadas aprobadas"


  entrega:
    name: Entrega del proyecto
    needs: pruebas
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Empaquetar codigo fuente
        run: |
          zip -r academiclab-proyecto.zip \
            app.py \
            main.py \
            test_main.py \
            test_app.py \
            test_consola.py \
            generar_dashboard.py \
            requirements.txt \
            .coveragerc \
            templates \
            static \
            -x '*.pyc' '*/__pycache__/*'

      - name: Publicar codigo fuente
        uses: actions/upload-artifact@v4
        with:
          name: academiclab-codigo-fuente
          path: academiclab-proyecto.zip
          retention-days: 30
